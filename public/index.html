<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Domine:wght@400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <title>Linguora</title>
  </head>

  <body>
    <header>
      <div class="header">
        <h1>Linguora</h1>
      </div>
    </header>

<main class="page">
  <div class="content">
    <div class="card-header">
      <span class="card-title" id="title-wod"></span>
      <div class="lang-toggle" role="group" aria-label="Language Toggle">
        <button type="button" class="lang-btn active" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="de">DE</button>
      </div>
    </div>

    <div class="card">
      <div class="card-content">
        <p class="word" id="word"></p>
        <p class="pronunciation" id="ipa"></p>
        <p class="definition" id="definition"></p>
        <p class="example" id="example"></p>
      </div>
    </div>

    <div class="card-footer">
      <span class="footer-text" id="footer-text"></span>
    </div>
  </div>
</main>
  </body>

  <script src="script.js"></script>
</html>
